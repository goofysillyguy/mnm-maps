name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and package
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Check packaged executable
        shell: pwsh
        run: ./scripts/check-package.ps1
      - name: Upload Windows distribution
        uses: actions/upload-artifact@v7
        with:
          name: MnMMaps-win-x64
          path: artifacts/release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
