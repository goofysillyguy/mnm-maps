name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v0.1.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate version and release notes
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a version tag such as v0.1.1.' }
          [xml]$mapProject = Get-Content ./src/MnMMaps.App/MnMMaps.App.csproj
          if ('v' + $mapProject.Project.PropertyGroup.Version -ne $env:RELEASE_TAG) { throw 'Tag and project version differ.' }
          if (-not (Test-Path -LiteralPath "docs/releases/$env:RELEASE_TAG.md")) { throw 'Release notes are missing.' }
      - name: Build and package
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Check packaged executable
        shell: pwsh
        run: ./scripts/check-package.ps1
      - name: Publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG ./artifacts/release/MnMMaps.exe ./artifacts/release/MnMMaps-win-x64.zip ./artifacts/release/SHA256SUMS.txt --verify-tag --title "MnM Maps $env:RELEASE_TAG" --notes-file "docs/releases/$env:RELEASE_TAG.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
